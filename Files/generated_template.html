<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>المنتجات</title>
    </head>
    <body style="font-family: sans-serif; background: #f0f0f0; direction: rtl; text-align: center;">
        <div style="width: 90%; margin: auto; padding-top: 40px;">
            {% if add_form %}
                <div style="width: 320px; margin: auto; background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #aaa; text-align: center;">
                    <h2>إضافة منتج جديد</h2>
                    <form method="POST" action="" enctype="multipart/form-data">
                        <label>اسم المنتج:</label>
                        <input type="text" name="ahmed" value="{{ request.form.get('ahmed', '') }}" style="width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #aaa; border-radius: 5px;" required>
                        <label>السعر:</label>
                        <input type="number" name="price" value="{{ request.form.get('price', '') }}" style="width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #aaa; border-radius: 5px;" step="0.01" required>
                        <label>اختر صورة:</label>
                        <input type="file" name="image" style="width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #aaa; border-radius: 5px;" accept="image/*" required>
                        <button type="submit" style="padding: 10px 20px; background-color: #00a1ff; color: white; border: none; border-radius: 8px; cursor: pointer;">حفظ المنتج</button>
                    </form>
                    <br/>
                    <a href="/" style="text-decoration: none; color: #333;">رجوع</a>
                </div>
            {% elif product %}
                <div style="width: 320px; margin: auto; background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px #aaa; text-align: center;">
                    <h2>{{ product.name | upper }}</h2>
                    <img src="{{ product.image_url }}" alt="image" style="width: 100%; border-radius: 10px;">
                    <p>السعر: {{ product.price }} $</p>
                    <form method="POST" action="/delete/{{ product.id }}">
                        <button style="background-color: red; margin-top: 7px; width: 100%; padding: 10px 20px; color: white; border: none; border-radius: 8px; cursor: pointer;">
                            حذف المنتج
                        </button>
                    </form>
                    <br/>
                    <a href="/" style="text-decoration: none; color: #333;">رجوع</a>
                </div>
            {% else %}
                <a href="/add">
                    <button style="padding: 10px 20px; background-color: #00a1ff; color: white; border: none; border-radius: 8px; cursor: pointer;">
                        إضافة منتج جديد
                    </button>
                </a>
                <br/>
                <br/>
                {% for p in products %}
                    <div style="width: 220px; background-color: white; padding: 15px; border-radius: 10px; margin: 15px; display: inline-block; box-shadow: 0 0 7px #aaa;">
                        <img src="{{ p.image_url }}" alt="image" style="width: 100%; border-radius: 10px;">
                        <h3>{{ p.name | upper }}</h3>
                        <p>{{ p.price }} $</p>
                        <a href="/product/{{ p.id }}" style="text-decoration: none; color: #333;">عرض التفاصيل</a>
                        <form method="POST" action="/delete/{{ p.id }}">
                            <button style="background-color: red; margin-top: 7px; width: 100%; padding: 10px 20px; color: white; border: none; border-radius: 8px; cursor: pointer;">
                                حذف
                            </button>
                        </form>
                    </div>
                {% endfor %}
            {% endif %}
        </div>
    </body>
</html>
